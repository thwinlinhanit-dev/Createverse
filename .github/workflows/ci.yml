name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile
      - name: check (typecheck, lint, test, content validate)
        run: pnpm check

  # P1-13 + P1-14 (TESTING.md section 8/9): axe via Playwright, the virtual
  # passkey ceremony against the real API, and the child journey on phone and
  # tablet viewports in both languages (live AI off). Playwright starts both
  # servers itself (API --e2e + vite dev).
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (accessibility + passkey + child journey)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
